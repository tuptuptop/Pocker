# Pocker Studio + Agent — Docker Compose Setup
#
# Requirements:
#   - Docker & Docker Compose
#   - A provider API key in .env (OpenAI, OpenRouter, or Anthropic)
#
# Quick Start:
#   1. cp .env.example .env
#   2. Add your provider key to .env (e.g. OPENAI_API_KEY / ANTHROPIC_API_KEY)
#   3. docker compose up
#   4. Open http://localhost:3000
#
# The agent backend is the Rust-native `pocker-agent` binary (no Python).
# It proxies any OpenAI-compatible provider and speaks the Hermes HTTP
# contract that PockerStudio expects.

services:
  # The Pocker Rust-native agent backend
  # Provides the backend API that the studio connects to (port 8642).
  pocker-agent:
    build:
      context: ..
      dockerfile: PockerStudio/docker/agent/Dockerfile
    env_file:
      - .env
    environment:
      # Defaults to the OpenAI-compatible provider; override via .env.
      POCKER_AGENT_PROVIDER: ${POCKER_AGENT_PROVIDER:-openai}
      POCKER_AGENT_PORT: "8642"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8642/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    ports:
      - '8642:8642'

  # The Pocker Studio Web UI
  # Connects to pocker-agent at http://pocker-agent:8642
  #
  # Redis: if REDIS_URL=redis://redis:6379 is set in .env and the redis
  # profile is active, the studio will automatically use Redis for session
  # persistence. If Redis is unavailable on startup, it retries for ~30s
  # then falls back to the file-based store gracefully.
  pocker-studio:
    build:
      context: .
      dockerfile: docker/workspace/Dockerfile
    depends_on:
      pocker-agent:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Internal Docker network URL (not localhost!)
      HERMES_API_URL: http://pocker-agent:8642
      # Inherited from .env — empty string means "no Redis, use file store".
      # Set REDIS_URL=redis://redis:6379 in .env when running --profile redis.
      REDIS_URL: ${REDIS_URL:-}
    volumes:
      # Persist file-based sessions across container restarts (fallback store)
      - studio-sessions:/app/.runtime
    ports:
      - '3000:3000'

  # ─── Optional: Redis session persistence ──────────────────────────────────
  # Activate with: docker compose --profile redis up
  #
  # Enables durable, multi-device session storage backed by Redis AOF.
  # Sessions survive both studio and agent container restarts.
  redis:
    image: redis:7-alpine
    profiles:
      - redis
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

volumes:
  studio-sessions:
  redis-data:
