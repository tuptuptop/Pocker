[workspace]
resolver = "2"
members = [
    "crates/pocker-core",
    "crates/pocker-engine",
    "crates/pocker-plugin",
    "crates/pocker-sandbox",
    "crates/pocker-cli",
    "crates/pocker-tui",
    "crates/pocker-hub",
    "crates/pocker-studio",
    "crates/pocker-sdk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Pocker Contributors"]
repository = "https://github.com/pocker/pocker"
homepage = "https://github.com/pocker/pocker"
description = "Pocker — Plugin as a Service. Everything is a Plugin."

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# HTTP / API
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
hyper = "1.0"

# WebSocket
tokio-tungstenite = "0.23"

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }
redis = { version = "0.27", features = ["tokio-comp"] }

# Cryptography / Security
sha2 = "0.10"
rand = "0.8"

# Misc
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
url = "2.5"
dirs = "5.0"
regex = "1.10"
glob = "0.3"
notify = "6.1"
walkdir = "2.5"
which = "6.0"
indicatif = "0.17"
colored = "2.1"

# Testing
tempfile = "3.12"

# Internal crates (for cross-references)
pocker-core = { path = "crates/pocker-core" }
pocker-plugin = { path = "crates/pocker-plugin" }
pocker-engine = { path = "crates/pocker-engine" }
pocker-sandbox = { path = "crates/pocker-sandbox" }
pocker-sdk = { path = "crates/pocker-sdk" }
pocker-studio = { path = "crates/pocker-studio" }
pocker-hub = { path = "crates/pocker-hub" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
